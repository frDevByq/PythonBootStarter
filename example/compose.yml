services:
  postgres:
    image: postgres:16
    container_name: pythonboot-starter-example-postgres
    environment:
      POSTGRES_USER: pythonboot
      POSTGRES_PASSWORD: pythonboot
      POSTGRES_DB: pythonboot_example
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7
    container_name: pythonboot-starter-example-redis
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis-data:/data
volumes:
  postgres-data:
  redis-data:
